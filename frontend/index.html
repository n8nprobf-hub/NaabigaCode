<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaabigaCode — Terminal intelligent</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0b0b12;
        color: #e8e8f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      .term-canvas {
        flex: 1;
        overflow: auto;
        padding: 12px;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .input-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid #1f1f2e;
        background: #0b0b12;
      }
      .input-row input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #e8e8f0;
        font-family: inherit;
        font-size: 13px;
      }
      .status-bar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 12px;
        border-top: 1px solid #1f1f2e;
        background: #0f0f1a;
        color: #7a7a90;
        font-size: 12px;
      }
      .chip {
        padding: 2px 8px;
        border-radius: 9999px;
        border: 1px solid #1f1f2e;
        background: #13131f;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
